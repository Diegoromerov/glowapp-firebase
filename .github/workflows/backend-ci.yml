name: Backend CI

# El backend vive aqui desde 2026-11-02: `glowapp-api` lo despliega desde este
# repositorio (root `/backend`). `belleza-app` queda como archivo historico y no
# deberia construir nada.
on:
  push:
    branches: [main, staging]
    paths:
      - 'backend/**'
      - 'tools/verificar_contrato_api.py'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tools/verificar_contrato_api.py'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend:
    name: Backend - Sintaxis, pruebas y contrato
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # alpine no trae PostGIS y el esquema lo exige (init.sql:7). La imagen
        # oficial de PostGIS ya lo carga al arrancar.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glowtest
          PGDATA: /var/lib/postgresql/data/pgdata
          # La imagen postgis/postgis:16-3.4 inicializa con trust auth para
          # conexiones locales. Usamos trust explícito y conectamos sin password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Comprobar sintaxis de todo el codigo
        run: |
          fail=0
          for f in $(find src scripts -name '*.js' -type f); do
            node --check "$f" || { echo "SINTAXIS: $f"; fail=1; }
          done
          exit $fail

      - name: El entrypoint reescribe DATABASE_URL en ambos esquemas
        run: |
          for prefijo in "postgres://" "postgresql://"; do
            entrada="${prefijo}postgres:secreto@host:5432/db"
            salida=$(printf '%s' "$entrada" | sed -E "s#^postgres(ql)?://[^@]+@#postgresql://app_rls_user:PASS@#")
            case "$salida" in
              *"app_rls_user:PASS@"*) echo "OK con ${prefijo}";;
              *) echo "FALLA con ${prefijo}: $salida"; exit 1;;
            esac
          done

      - name: Pruebas que no necesitan infraestructura
        run: node --test src/tests/*.nodetest.js

      - name: Preparar base de datos con RLS (prepareRlsDatabase.js)
        env:
          # trust auth: sin password en la URL
          DATABASE_URL_ADMIN: postgres://postgres@localhost:5432/glowtest
          RLS_ROLE_PASSWORD: test_rls_password
          # 123_checkout_tenant_wompi.sql ya NO se omite.
          #
          # Se omitia porque «toca tablas GlowShop que no existen en CI», pero la
          # 010 crea pedidos_tienda y detalles_pedido_tienda en la base nueva, y
          # 010 si corre. El resultado era el peor de los dos mundos: CI tenia las
          # tablas SIN tenant_id, un esquema que no existe en ningun otro sitio.
          # Los tests de integracion lo destaparon al insertar con tenant_id.
        run: node scripts/prepareRlsDatabase.js

      - name: Verificar aislamiento multi-tenant (verifyTenantIsolation.js)
        env:
          # trust auth: sin password en la URL
          TEST_DATABASE_URL: postgres://app_owner@localhost:5432/glowtest
        run: node scripts/verifyTenantIsolation.js

      - name: Contrato app <-> API
        # Se ejecuta desde la raiz del monorepo: la herramienta compara lo que
        # llaman las apps contra lo que publica este backend.
        working-directory: .
        run: python3 tools/verificar_contrato_api.py .

      - name: Tests de contrato que requieren BD (audience-binding, routersMontados, critical-endpoints)
        env:
          # trust auth: sin password en la URL
          DATABASE_URL: postgres://app_rls_user@localhost:5432/glowtest
          JWT_SECRET: test-secret-min-32-chars-long-enough-for-testing-only
          USE_PG_MEM: 'false'
        run: npx jest src/tests/contract/audience-binding.contract.test.js src/tests/contract/routersMontados.contract.test.js src/tests/contract/critical-endpoints.contract.test.js src/tests/hermesAgentSchema.contract.test.js --forceExit --verbose

      # Los tests de integración del libro de puntos se saltaban en CI porque
      # nadie los llamaba: el servicio Postgres ya estaba levantado y las
      # migraciones aplicadas. Son los únicos que tocan una base real, y por eso
      # son los que habrían visto una columna inexistente (pasó con fecha_alta)
      # o un RLS que devuelve cero filas en silencio.
      - name: Tests de integración contra Postgres real
        working-directory: backend
        env:
          DATABASE_URL: postgres://app_rls_user@localhost:5432/glowtest
          DATABASE_URL_ADMIN: postgres://postgres@localhost:5432/glowtest
          JWT_SECRET: test-secret-min-32-chars-long-enough-for-testing-only
          USE_PG_MEM: 'false'
        run: |
          npx jest tests/pointsLedger.integration.test.js tests/auth.integration.test.js --runInBand --forceExit --verbose

      - name: Sembrar catalogo de prueba (rol admin)
        working-directory: backend
        env:
          DATABASE_URL_ADMIN: postgres://postgres@localhost:5432/glowtest
        run: node scripts/seedCatalogoCI.js

      - name: La API sirve catalogo con el rol restringido (E2E)
        env:
          DATABASE_URL: postgres://app_rls_user@localhost:5432/glowtest
          DATABASE_URL_ADMIN: postgres://postgres@localhost:5432/glowtest
          JWT_SECRET: test-secret-min-32-chars-long-enough-for-testing-only
          # NO usar 'test': backend/index.js solo llama app.listen cuando
          # NODE_ENV !== 'test'. Con 'test' el servidor nunca arranca y el curl
          # devuelve vacio (fallaba con JSONDecodeError, enmascarando la causa).
          NODE_ENV: staging
          PORT: 8081
          # En staging/produccion el arranque falla cerrado sin esta clave, a
          # proposito: la biometria no se deriva del JWT_SECRET. Valor de test.
          BIOMETRIC_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          # Sin esto, un job de pagos consulta una tabla ausente en la BD de CI y
          # tumba el proceso antes de que la prueba mida el catalogo.
          DISABLE_BACKGROUND_JOBS: 'true'
        run: |
          node index.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid

          # La unica ruta de salud es /api/health; /health no existe.
          # Se acepta CUALQUIER codigo HTTP: aqui solo se comprueba que el
          # puerto responde. Un 503 es legitimo mientras el arranque aplica
          # migraciones (el rol restringido no puede aplicarlas), y con -f se
          # interpretaba como "servidor caido".
          ready=0
          for i in $(seq 1 45); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 \
                     http://localhost:8081/api/health || true)
            if [ -n "$codigo" ] && [ "$codigo" != "000" ]; then
              ready=1
              echo "API responde en /api/health (HTTP $codigo)"
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "La API no respondio en /api/health tras 30s"
            tail -60 /tmp/api.log
            kill "$(cat /tmp/api.pid)" 2>/dev/null || true
            exit 1
          fi

          # Catálogo público: debe devolver datos, no una lista vacía.
          code=$(curl -s -o /tmp/prov.json -w '%{http_code}' --max-time 20 \
                 -H 'X-App-Audience: client' http://localhost:8081/api/providers)
          echo "HTTP $code"
          head -c 300 /tmp/prov.json; echo
          kill "$(cat /tmp/api.pid)" 2>/dev/null || true

          if [ "$code" != "200" ]; then
            echo "FALLO: /api/providers devolvio $code con el rol restringido"
            echo "---------- ultimas 80 lineas del log de la API ----------"
            tail -80 /tmp/api.log
            exit 1
          fi

          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/prov.json'))
          data = d.get('data') or d.get('providers') or []
          n = d.get('count', len(data))
          assert n > 0, f"catalogo vacio: RLS sin contexto (count={n})"
          print(f"OK: catalogo visible con rol restringido ({n} proveedor/es)")
          PY

  verificacion-entorno:
    name: Verificacion X-App-Audience
    needs: backend
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Elegir host segun la rama
        id: host
        run: |
          # El staging se sirve desde su propio servicio (glowapp-api-staging),
          # porque el servicio de produccion no puede apuntar a dos ramas: la
          # rama es a nivel de servicio en Railway.
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "url=https://glowapp-api-production.up.railway.app" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://glowapp-api-staging-staging.up.railway.app" >> "$GITHUB_OUTPUT"
          fi

      - name: La cabecera es obligatoria
        run: |
          url='${{ steps.host.outputs.url }}'
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url/api/providers")
          echo "sin cabecera -> $code"
          test "$code" = "400"

      - name: Con auditorio client responde
        run: |
          url='${{ steps.host.outputs.url }}'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-App-Audience: client' "$url/api/providers")
          echo "client -> $code"
          test "$code" = "200"
