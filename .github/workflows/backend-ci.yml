name: Backend CI

# El backend vive aqui desde 2026-11-02: `glowapp-api` lo despliega desde este
# repositorio (root `/backend`). `belleza-app` queda como archivo historico y no
# deberia construir nada.
on:
  push:
    branches: [main, staging]
    paths:
      - 'backend/**'
      - 'tools/verificar_contrato_api.py'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tools/verificar_contrato_api.py'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend:
    name: Backend - Sintaxis, pruebas y contrato
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glowtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Comprobar sintaxis de todo el codigo
        run: |
          fail=0
          for f in $(find src scripts -name '*.js' -type f); do
            node --check "$f" || { echo "SINTAXIS: $f"; fail=1; }
          done
          exit $fail

      - name: Pruebas que no necesitan infraestructura
        run: node --test src/tests/*.nodetest.js

      - name: Preparar base de datos con RLS (prepareRlsDatabase.js)
        env:
          DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/glowtest
          RLS_ROLE_PASSWORD: test_rls_password
        run: node scripts/prepareRlsDatabase.js

      - name: Verificar aislamiento multi-tenant (verifyTenantIsolation.js)
        env:
          TEST_DATABASE_URL: postgres://app_owner:test_rls_password@localhost:5432/glowtest
        run: node scripts/verifyTenantIsolation.js

      - name: Contrato app <-> API
        # Compara lo que llaman las dos apps Flutter contra lo que publica este
        # backend. Falla si una pantalla pide una ruta que no existe: es lo que
        # en `belleza-app` no se podia hacer porque los dos arboles vivian en
        # repos distintos.
        working-directory: ..
        run: python3 tools/verificar_contrato_api.py .

      - name: Tests de contrato que requieren BD (audience-binding, routersMontados, critical-endpoints)
        env:
          DATABASE_URL: postgres://app_rls_user:test_rls_password@localhost:5432/glowtest
          JWT_SECRET: test-secret-min-32-chars-long-enough-for-testing-only
        run: npx jest --testPathPattern="src/tests/contract" --forceExit --verbose

  staging-verification:
    name: Staging - Verificacion X-App-Audience + RLS
    needs: backend
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Verificar X-App-Audience + RLS en staging
        run: |
          echo "🔍 Verificando header X-App-Audience en staging..."
          # Comprobar que el header es requerido en /api
          curl -s -o /dev/null -w "%{http_code}" -H "X-App-Audience: client" https://glowapp-api-production.up.railway.app/api/providers | grep -q "200" && echo "✅ client header aceptado" || (echo "❌ client header rechazado" && exit 1)
          
          # Comprobar que sin header falla
          curl -s -o /dev/null -w "%{http_code}" https://glowapp-api-production.up.railway.app/api/providers | grep -q "400" && echo "✅ sin header → 400" || (echo "❌ sin header no da 400" && exit 1)
          
          # Comprobar audience mismatch
          curl -s -o /dev/null -w "%{http_code}" -H "X-App-Audience: salon" https://glowapp-api-production.up.railway.app/api/providers | grep -q "403" && echo "✅ audience mismatch → 403" || (echo "❌ audience mismatch no da 403" && exit 1)
          
          echo "✅ Staging verificado: X-App-Audience + RLS en vigor"
