name: Backend CI

# El backend vive aqui desde 2026-11-02: `glowapp-api` lo despliega desde este
# repositorio (root `/backend`). `belleza-app` queda como archivo historico y no
# deberia construir nada.
on:
  push:
    branches: [main, staging]
    paths:
      - 'backend/**'
      - 'tools/verificar_contrato_api.py'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tools/verificar_contrato_api.py'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend:
    name: Backend - Sintaxis, pruebas y contrato
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # alpine no trae PostGIS y el esquema lo exige (init.sql:7). La imagen
        # oficial de PostGIS ya lo carga al arrancar.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glowtest
          PGDATA: /var/lib/postgresql/data/pgdata
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Comprobar sintaxis de todo el codigo
        run: |
          fail=0
          for f in $(find src scripts -name '*.js' -type f); do
            node --check "$f" || { echo "SINTAXIS: $f"; fail=1; }
          done
          exit $fail

      - name: Pruebas que no necesitan infraestructura
        run: node --test src/tests/*.nodetest.js

      - name: Instalar pgvector en el contenedor PostGIS
        # 029_refactor_biometric_architecture_premium.sql necesita CREATE EXTENSION vector
        # La imagen postgis/postgis:16-3.4 (Debian 12) tiene el repo de PG para bullseye (11) que falla.
        # Arreglamos el sources.list y instalamos postgresql-16-pgvector del repo oficial de PG para bookworm.
        run: |
          CONTAINER=$(docker ps --filter "name=postgispostgis1634" --format "{{.Names}}" | head -1)
          echo "Contenedor PostGIS: $CONTAINER"
          docker exec -u root "$CONTAINER" bash -c '
            sed -i "s/bullseye-pgdg/bookworm-pgdg/g" /etc/apt/sources.list.d/pgdg.list 2>/dev/null || true
            apt-get update -qq && apt-get install -y -qq postgresql-16-pgvector >/dev/null
          ' && echo "pgvector instalado OK"

      - name: Preparar base de datos con RLS (prepareRlsDatabase.js)
        env:
          DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/glowtest
          RLS_ROLE_PASSWORD: test_rls_password
        run: node scripts/prepareRlsDatabase.js

      - name: Verificar aislamiento multi-tenant (verifyTenantIsolation.js)
        env:
          TEST_DATABASE_URL: postgres://app_owner:test_rls_password@localhost:5432/glowtest
        run: node scripts/verifyTenantIsolation.js

      - name: Contrato app <-> API
        # Se ejecuta desde la raiz del monorepo: la herramienta compara lo que
        # llaman las apps contra lo que publica este backend.
        working-directory: .
        run: python3 tools/verificar_contrato_api.py .

      - name: Tests de contrato que requieren BD (audience-binding, routersMontados, critical-endpoints)
        env:
          DATABASE_URL: postgres://app_rls_user:test_rls_password@localhost:5432/glowtest
          JWT_SECRET: test-secret-min-32-chars-long-enough-for-testing-only
        run: npx jest --testPathPattern="src/tests/contract" --forceExit --verbose

  verificacion-entorno:
    name: Verificacion X-App-Audience
    needs: backend
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Elegir host segun la rama
        id: host
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "url=https://glowapp-api-production.up.railway.app" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://glowapp-api-staging.up.railway.app" >> "$GITHUB_OUTPUT"
          fi

      - name: La cabecera es obligatoria
        run: |
          url='${{ steps.host.outputs.url }}'
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url/api/providers")
          echo "sin cabecera -> $code"
          test "$code" = "400"

      - name: Con auditorio client responde
        run: |
          url='${{ steps.host.outputs.url }}'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-App-Audience: client' "$url/api/providers")
          echo "client -> $code"
          test "$code" = "200"
