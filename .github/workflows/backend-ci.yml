name: Backend CI

# El backend vive aqui desde 2026-11-02: `glowapp-api` lo despliega desde este
# repositorio (root `/backend`). `belleza-app` queda como archivo historico y no
# deberia construir nada.
on:
  push:
    branches: [main, staging]
    paths:
      - 'backend/**'
      - 'tools/verificar_contrato_api.py'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tools/verificar_contrato_api.py'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend:
    name: Backend - Sintaxis, pruebas y contrato
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # alpine no trae PostGIS y el esquema lo exige (init.sql:7). La imagen
        # oficial de PostGIS ya lo carga al arrancar.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glowtest
          PGDATA: /var/lib/postgresql/data/pgdata
          # La imagen postgis/postgis:16-3.4 inicializa con trust auth para
          # conexiones locales. Usamos trust explícito y conectamos sin password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Comprobar sintaxis de todo el codigo
        run: |
          fail=0
          for f in $(find src scripts -name '*.js' -type f); do
            node --check "$f" || { echo "SINTAXIS: $f"; fail=1; }
          done
          exit $fail

      - name: El entrypoint reescribe DATABASE_URL en ambos esquemas
        run: |
          for prefijo in "postgres://" "postgresql://"; do
            entrada="${prefijo}postgres:secreto@host:5432/db"
            salida=$(printf '%s' "$entrada" | sed -E "s#^postgres(ql)?://[^@]+@#postgresql://app_rls_user:PASS@#")
            case "$salida" in
              *"app_rls_user:PASS@"*) echo "OK con ${prefijo}";;
              *) echo "FALLA con ${prefijo}: $salida"; exit 1;;
            esac
          done

      - name: Pruebas que no necesitan infraestructura
        run: node --test src/tests/*.nodetest.js

      - name: Preparar base de datos con RLS (prepareRlsDatabase.js)
        env:
          # trust auth: sin password en la URL
          DATABASE_URL_ADMIN: postgres://postgres@localhost:5432/glowtest
          RLS_ROLE_PASSWORD: test_rls_password
          # 123_checkout_tenant_wompi.sql toca tablas del esquema GlowShop
          # (pedidos_tienda, etc.) que no existen en el conjunto nucleo de CI.
          # La migracion ahora guarda cada ALTER con to_regclass y emite NOTICE
          # si la tabla falta; aun asi la omitimos aqui para que el pipeline no
          # dependa de NOTICE silenciosos.
          MIGRAR_OMITIR: '123_checkout_tenant_wompi.sql'
        run: node scripts/prepareRlsDatabase.js

      - name: Verificar aislamiento multi-tenant (verifyTenantIsolation.js)
        env:
          # trust auth: sin password en la URL
          TEST_DATABASE_URL: postgres://app_owner@localhost:5432/glowtest
        run: node scripts/verifyTenantIsolation.js

      - name: Contrato app <-> API
        # Se ejecuta desde la raiz del monorepo: la herramienta compara lo que
        # llaman las apps contra lo que publica este backend.
        working-directory: .
        run: python3 tools/verificar_contrato_api.py .

      - name: Tests de contrato que requieren BD (audience-binding, routersMontados, critical-endpoints)
        env:
          # trust auth: sin password en la URL
          DATABASE_URL: postgres://app_rls_user@localhost:5432/glowtest
          JWT_SECRET: test-secret-min-32-chars-long-enough-for-testing-only
        run: npx jest src/tests/contract/audience-binding.contract.test.js src/tests/contract/routersMontados.contract.test.js src/tests/contract/critical-endpoints.contract.test.js --forceExit --verbose

      - name: La API sirve catalogo con el rol restringido (E2E)
        env:
          DATABASE_URL: postgres://app_rls_user@localhost:5432/glowtest
          DATABASE_URL_ADMIN: postgres://postgres@localhost:5432/glowtest
          JWT_SECRET: test-secret-min-32-chars-long-enough-for-testing-only
          NODE_ENV: test
          PORT: 8081
        run: |
          node index.js & echo $! > /tmp/api.pid
          for i in $(seq 1 30); do curl -sf http://localhost:8081/health && break; sleep 1; done
          # catálogo público: debe devolver datos, no una lista vacía
          curl -s -H 'X-App-Audience: client' http://localhost:8081/api/providers | tee /tmp/prov.json
          python3 -c "import json,sys; d=json.load(open('/tmp/prov.json')); assert d.get('count',0) > 0, 'catalogo vacio: RLS sin contexto'"
          kill $(cat /tmp/api.pid)

  verificacion-entorno:
    name: Verificacion X-App-Audience
    needs: backend
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Elegir host segun la rama
        id: host
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "url=https://glowapp-api-production.up.railway.app" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://glowapp-api-staging.up.railway.app" >> "$GITHUB_OUTPUT"
          fi

      - name: La cabecera es obligatoria
        run: |
          url='${{ steps.host.outputs.url }}'
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url/api/providers")
          echo "sin cabecera -> $code"
          test "$code" = "400"

      - name: Con auditorio client responde
        run: |
          url='${{ steps.host.outputs.url }}'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-App-Audience: client' "$url/api/providers")
          echo "client -> $code"
          test "$code" = "200"
