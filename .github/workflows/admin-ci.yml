name: Admin CI

on:
  push:
    paths:
      - 'admin/**'
  pull_request:
    paths:
      - 'admin/**'

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
        working-directory: admin
      - run: npm test
        working-directory: admin
      - run: npm run build
        working-directory: admin
