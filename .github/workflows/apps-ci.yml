name: GlowApp Firebase Deploy

# ─── CI MANUAL ───────────────────────────────────────────────────────────────
# Este repo es privado y los minutos de Actions se facturan. El 4-nov-2026 se
# consumieron ~430 min en un solo día porque cada push disparaba DOS pipelines
# completos (main y staging) de 5 jobs, incluidos builds de Flutter para
# commits que solo tocaban documentación.
#
# Reglas de este workflow:
#   * Nada corre solo. Se lanza a mano desde Actions → Run workflow.
#   * Se elige qué app compilar: el prestador no paga el build del cliente.
#   * Publicar es una segunda decisión explícita (`deploy`), con environment
#     de protección. Sin marcar la casilla, solo se compila y se prueba.
#   * `concurrency` cancela la corrida anterior del mismo ref: dos clics
#     seguidos no queman minutos duplicados.
#   * `fetch-depth: 1`: el historial completo no hace falta y encarece el
#     checkout y el bootstrap de melos.
#
# El despliegue de todos los días sigue siendo local:
#   ./scripts/desplegar-web.sh glow_provider glowapp-provider

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Qué compilar'
        type: choice
        options: [prestador, cliente, ambas]
        default: cliente
      deploy:
        description: 'Publicar en Firebase Hosting al terminar'
        type: boolean
        default: false
      canal:
        description: 'Canal de publicación'
        type: choice
        options: [staging, live]
        default: staging

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: '3.47.9'

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # 1. Puerta de calidad. Un solo job para no pagar el arranque de tres.
  # ───────────────────────────────────────────────────────────────────────────
  verificar:
    name: Analyze & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Setup Dart/Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}

      - name: Install Melos
        run: dart pub global activate melos 6.2.0

      - name: Add Melos to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Melos Bootstrap
        run: |
          case "${{ inputs.app }}" in
            cliente) melos bootstrap --scope=glow_client --include-dependencies ;;
            prestador) melos bootstrap --scope=glow_provider --include-dependencies ;;
            ambas) melos bootstrap --scope='glow_*' --include-dependencies ;;
          esac
        working-directory: ${{ github.workspace }}

      - name: Analyze glow_core
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: ${{ github.workspace }}/packages/glow_core

      # Invariante de GlowGuide: cada paso de ClientGuide/ProviderGuide debe tener
      # su video en video_mapping.dart. Sin esto, un cambio de id deja el
      # reproductor visible pero sin video y nadie se entera hasta producción.
      - name: GlowGuide Video Mapping Tests (glow_core)
        run: flutter test test/glowguide/video_mapping_test.dart
        working-directory: ${{ github.workspace }}/packages/glow_core

      - name: Analyze & Test glow_provider
        if: ${{ inputs.app == 'prestador' || inputs.app == 'ambas' }}
        run: |
          cd apps/glow_provider
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
        working-directory: ${{ github.workspace }}

      - name: Analyze & Test glow_client
        if: ${{ inputs.app == 'cliente' || inputs.app == 'ambas' }}
        run: |
          cd apps/glow_client
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
        working-directory: ${{ github.workspace }}

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Build del prestador (solo si se pidió)
  # ───────────────────────────────────────────────────────────────────────────
  compilar-prestador:
    name: Build glow_provider
    needs: verificar
    if: ${{ inputs.app == 'prestador' || inputs.app == 'ambas' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Setup Dart/Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Melos Bootstrap
        run: |
          dart pub global activate melos 6.2.0
          export PATH="$HOME/.pub-cache/bin:$PATH"
          melos bootstrap --scope=glow_provider --include-dependencies
        working-directory: ${{ github.workspace }}

      - name: Build Glow Provider Web
        run: |
          cd apps/glow_provider
          flutter build web --release \
            --dart-define=FIREBASE_API_KEY=${{ secrets.PROVIDER_FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.PROVIDER_FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.PROVIDER_FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.PROVIDER_FIREBASE_STORAGE_BUCKET }} \
            --dart-define=FIREBASE_WEB_APP_ID=${{ secrets.PROVIDER_FIREBASE_WEB_APP_ID }} \
            --dart-define=FIREBASE_ANDROID_APP_ID=${{ secrets.PROVIDER_FIREBASE_ANDROID_APP_ID }} \
            --dart-define=FIREBASE_IOS_APP_ID=${{ secrets.PROVIDER_FIREBASE_IOS_APP_ID }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.PROVIDER_GOOGLE_WEB_CLIENT_ID }} \
            --dart-define=API_URL=${{ inputs.canal == 'live' && 'https://glowapp-api-production.up.railway.app' || 'https://glowapp-api-staging-staging.up.railway.app' }} \
            --dart-define=APP_AUDIENCE=provider
        working-directory: ${{ github.workspace }}

      - name: Upload Provider Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: glow-provider-web
          path: apps/glow_provider/build/web/
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Build del cliente (solo si se pidió)
  # ───────────────────────────────────────────────────────────────────────────
  compilar-cliente:
    name: Build glow_client
    needs: verificar
    if: ${{ inputs.app == 'cliente' || inputs.app == 'ambas' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Setup Dart/Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Melos Bootstrap
        run: |
          dart pub global activate melos 6.2.0
          export PATH="$HOME/.pub-cache/bin:$PATH"
          melos bootstrap --scope=glow_client --include-dependencies
        working-directory: ${{ github.workspace }}

      - name: Build Glow Client Web
        run: |
          cd apps/glow_client
          flutter build web --release \
            --dart-define=FIREBASE_API_KEY=${{ secrets.CLIENT_FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.CLIENT_FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.CLIENT_FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.CLIENT_FIREBASE_STORAGE_BUCKET }} \
            --dart-define=FIREBASE_WEB_APP_ID=${{ secrets.CLIENT_FIREBASE_WEB_APP_ID }} \
            --dart-define=FIREBASE_ANDROID_APP_ID=${{ secrets.CLIENT_FIREBASE_ANDROID_APP_ID }} \
            --dart-define=FIREBASE_IOS_APP_ID=${{ secrets.CLIENT_FIREBASE_IOS_APP_ID }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }} \
            --dart-define=API_URL=${{ inputs.canal == 'live' && 'https://glowapp-api-production.up.railway.app' || 'https://glowapp-api-staging-staging.up.railway.app' }} \
            --dart-define=APP_AUDIENCE=client
        working-directory: ${{ github.workspace }}

      - name: Upload Client Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: glow-client-web
          path: apps/glow_client/build/web/
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  # 3b. Build Android APK del cliente (solo si se pidió)
  # ───────────────────────────────────────────────────────────────────────────
  compilar-cliente-android:
    name: Build glow_client Android APK
    needs: verificar
    if: ${{ inputs.app == 'cliente' || inputs.app == 'ambas' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Setup Dart/Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Melos Bootstrap
        run: |
          dart pub global activate melos 6.2.0
          export PATH="$HOME/.pub-cache/bin:$PATH"
          melos bootstrap --scope=glow_client --include-dependencies
        working-directory: ${{ github.workspace }}

      - name: Decode Keystore
        id: keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore.p12
          echo "storeFile=keystore.p12" > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "storeType=PKCS12" >> android/key.properties
        working-directory: ${{ github.workspace }}/apps/glow_client

      - name: Write google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
        working-directory: ${{ github.workspace }}/apps/glow_client

      - name: Build Android APK (Release)
        run: |
          cd apps/glow_client
          flutter build apk --release \
            --dart-define=FIREBASE_API_KEY=${{ secrets.CLIENT_FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.CLIENT_FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.CLIENT_FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.CLIENT_FIREBASE_STORAGE_BUCKET }} \
            --dart-define=FIREBASE_ANDROID_APP_ID=${{ secrets.CLIENT_FIREBASE_ANDROID_APP_ID }} \
            --dart-define=API_URL=${{ inputs.canal == 'live' && 'https://glowapp-api-production.up.railway.app' || 'https://glowapp-api-staging-staging.up.railway.app' }} \
            --dart-define=APP_AUDIENCE=client
        working-directory: ${{ github.workspace }}

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: glow-client-apk
          path: apps/glow_client/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # 4. Publicación. Existe como job aparte para conservar el environment de
  #    protección; solo se crea si el Director marcó «deploy».
  # ───────────────────────────────────────────────────────────────────────────
  publicar-prestador:
    name: Deploy glow_provider
    needs: compilar-prestador
    if: ${{ inputs.deploy && (inputs.app == 'prestador' || inputs.app == 'ambas') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.canal == 'live' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Download Provider Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: glow-provider-web
          path: apps/glow_provider/build/web

      - name: Deploy to Firebase Hosting (Provider)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.PROVIDER_FIREBASE_SERVICE_ACCOUNT }}
          projectId: glowapp-provider
          entryPoint: apps/glow_provider
          channelId: ${{ inputs.canal }}
          expires: 7d

  publicar-cliente:
    name: Deploy glow_client
    needs: compilar-cliente
    if: ${{ inputs.deploy && (inputs.app == 'cliente' || inputs.app == 'ambas') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.canal == 'live' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Download Client Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: glow-client-web
          path: apps/glow_client/build/web

      - name: Deploy to Firebase Hosting (Client)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.CLIENT_FIREBASE_SERVICE_ACCOUNT }}
          projectId: glowapp-client
          entryPoint: apps/glow_client
          channelId: ${{ inputs.canal }}
          expires: 7d
